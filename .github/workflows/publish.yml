name: Publish to NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Show Package Version
        run: echo "Publishing @dev-core-ui/components@$(node -p "require('./package.json').version")"

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild Optional Binary Dependencies
        run: npm rebuild @rollup/rollup-linux-x64-gnu || npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Build Library
        run: npm run build

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
