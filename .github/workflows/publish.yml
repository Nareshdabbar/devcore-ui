name: Release & Publish to NPM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-and-publish:
    # PREVENTS INFINITE LOOP: Skip execution if commit was generated by standard-version
    if: "!contains(github.event.head_commit.message, 'chore(release)')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.ADMIN_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Dependencies
        run: npm ci

      - name: Rebuild Optional Binary Dependencies
        run: npm rebuild @rollup/rollup-linux-x64-gnu || npm install --no-save @rollup/rollup-linux-x64-gnu

      - name: Build Library
        run: npm run build

      - name: Bump Version & Update Changelog
        run: npm run release

      - name: Push Version & Tag to GitHub
        run: git push https://${{ secrets.ADMIN_PAT || secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main --follow-tags

      - name: Publish to NPM
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}